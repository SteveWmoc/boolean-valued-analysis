name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Reject unfinished proofs
        run: |
          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              BooleanValuedAnalysis BooleanValuedAnalysis.lean Audit; then
            echo "Lean proof placeholders are not permitted in the public library or audit probes."
            exit 1
          fi

      - name: Verify public module coverage
        run: |
          missing=0
          while IFS= read -r file; do
            module="${file%.lean}"
            module="${module//\//.}"
            if ! grep -Fxq "import ${module}" BooleanValuedAnalysis.lean; then
              echo "Missing from BooleanValuedAnalysis.lean: ${module}"
              missing=1
            fi
          done < <(find BooleanValuedAnalysis -type f -name '*.lean' | sort)
          exit "${missing}"

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          lint: false

      - name: Build public library
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee ci-build.log

      - name: Upload diagnostic build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m006-build-log
          path: ci-build.log

      - name: Run project linters
        run: lake lint

      - name: Compile M001 acceptance probe
        run: lake env lean Audit/M001Acceptance.lean

      - name: Compile M002 acceptance probe
        run: lake env lean Audit/M002Acceptance.lean

      - name: Compile M003 acceptance probe
        run: lake env lean Audit/M003Acceptance.lean

      - name: Compile M004 acceptance probe
        run: lake env lean Audit/M004Acceptance.lean

      - name: Compile M005 acceptance probe
        run: lake env lean Audit/M005Acceptance.lean

      - name: Compile M006 acceptance probe
        run: lake env lean Audit/M006Acceptance.lean
