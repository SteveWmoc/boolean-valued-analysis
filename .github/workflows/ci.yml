name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Reject unfinished proofs
        run: |
          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              BooleanValuedAnalysis BooleanValuedAnalysis.lean Audit docs; then
            echo "Lean proof placeholders are not permitted in public code, acceptance probes, or documentation probes."
            exit 1
          fi

      - name: Verify public module coverage
        run: |
          missing=0
          while IFS= read -r file; do
            module="${file%.lean}"
            module="${module//\//.}"
            if ! grep -Fxq "import ${module}" BooleanValuedAnalysis.lean; then
              echo "Missing from BooleanValuedAnalysis.lean: ${module}"
              missing=1
            fi
          done < <(find BooleanValuedAnalysis -type f -name '*.lean' | sort)
          exit "${missing}"

      - name: Verify release metadata coherence
        run: python3 scripts/check_release_metadata.py

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          lint: true
          axiom-audit: true
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Compile milestone acceptance probes
        shell: bash
        run: |
          set -euo pipefail
          for probe in Audit/M*Acceptance.lean; do
            echo "::group::$probe"
            lake env lean "$probe"
            echo "::endgroup::"
          done

      - name: Compile documentation Lean probes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r probe; do
            echo "::group::$probe"
            lake env lean "$probe"
            echo "::endgroup::"
          done < <(find docs -type f -name '*.lean' | sort)
