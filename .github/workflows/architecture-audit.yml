name: Boolean-valued architecture audit

on:
  push:
    branches: ["audit/architecture-reuse"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-probes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Tau Ceti's current Lean and Mathlib environment
        shell: bash
        run: |
          printf '%s\n' 'leanprover/lean4:v4.33.0-rc1' > lean-toolchain
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lakefile.toml')
          text = path.read_text()
          text = text.replace('rev = "v4.32.1"', 'rev = "d4519b399018129db0a28eda3488eddfed9f73c4"')
          path.write_text(text)
          PY
          rm -f lake-manifest.json

      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Compile independent-universe probe
        shell: bash
        run: |
          mkdir -p .lake/build/lib/lean/Audit
          lake env lean Audit/UniverseProbe.lean \
            -o .lake/build/lib/lean/Audit/UniverseProbe.olean

      - name: Compile formula-substitution probe
        run: lake env lean Audit/FormulaSubstitutionProbe.lean
