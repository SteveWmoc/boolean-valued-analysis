name: Boolean-valued architecture audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-probes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Tau Ceti's current Lean and Mathlib environment
        shell: bash
        env:
          TAUCETI_REPO: https://github.com/TauCetiProject/TauCeti.git
        run: |
          set -euo pipefail

          tau_dir="$RUNNER_TEMP/TauCeti"
          git clone --depth 1 "$TAUCETI_REPO" "$tau_dir"
          tau_sha="$(git -C "$tau_dir" rev-parse HEAD)"

          cp "$tau_dir/lean-toolchain" lean-toolchain
          mathlib_rev="$(python3 - "$tau_dir/lake-manifest.json" <<'PY'
          import json
          import sys

          manifest_path = sys.argv[1]
          with open(manifest_path, encoding="utf-8") as handle:
              manifest = json.load(handle)

          matches = [pkg for pkg in manifest["packages"] if pkg["name"] == "mathlib"]
          if len(matches) != 1:
              raise SystemExit(f"expected one Tau Ceti mathlib dependency, found {len(matches)}")
          print(matches[0]["rev"])
          PY
          )"

          TAUCETI_MATHLIB_REV="$mathlib_rev" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("lakefile.toml")
          text = path.read_text(encoding="utf-8")
          rev = os.environ["TAUCETI_MATHLIB_REV"]
          pattern = re.compile(
              r'(?ms)(\[\[require\]\]\s*.*?name\s*=\s*"mathlib".*?\nrev\s*=\s*")[^"]+(" )?'
          )
          match = pattern.search(text)
          if match is None:
              # Keep the replacement deliberately strict so dependency-layout changes fail loudly.
              pattern = re.compile(
                  r'(?ms)(\[\[require\]\]\s*.*?name\s*=\s*"mathlib".*?\nrev\s*=\s*")[^"]+(")'
              )
          text, count = pattern.subn(lambda m: f"{m.group(1)}{rev}{m.group(2)}", text, count=1)
          if count != 1:
              raise SystemExit("could not identify exactly one mathlib rev in lakefile.toml")
          path.write_text(text, encoding="utf-8")
          PY

          rm -f lake-manifest.json

          echo "Tau Ceti commit: $tau_sha"
          echo "Lean toolchain: $(cat lean-toolchain)"
          echo "Mathlib revision: $mathlib_rev"

      - name: Install Elan
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build public library
        run: lake build

      - name: Compile independent-universe probe
        shell: bash
        run: |
          mkdir -p .lake/build/lib/lean/Audit
          lake env lean Audit/UniverseProbe.lean \
            -o .lake/build/lib/lean/Audit/UniverseProbe.olean

      - name: Compile formula-substitution probe
        run: lake env lean Audit/FormulaSubstitutionProbe.lean

      - name: Compile M001 acceptance probe
        run: lake env lean Audit/M001Acceptance.lean

      - name: Compile independent-universe mixing probe
        run: lake env lean Audit/MixingProbe.lean
